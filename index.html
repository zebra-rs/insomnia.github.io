<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Insomnia NOS</title>
  <style>
    :root { --bg: #ffffff; --fg: #0a0a0a; --fg-soft: #737373; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000000; --fg: #f5f5f5; --fg-soft: #a3a3a3; }
    }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 0 16px;
      background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-align: center;
    }
    h1 { font-weight: 300; font-size: clamp(32px, 8vw, 56px); margin: 0 0 8px; letter-spacing: -0.02em; }
    p { color: var(--fg-soft); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Insomnia NOS</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
